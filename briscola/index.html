<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Briscola RL Arena</title>
        <style>
            /* VARIABILI RESPONSIVE: Dimensioni base (Schermo intero) */
            :root {
                --card-w: 110px;
                --card-h: 170px;
                --gap-cards: 20px;
                --briscola-left: 60px;
                --deck-left: 15%;
                --center-h: 200px;
                --score-pad: 25px;
                --score-font: 22px;
                --taken-w: 80px;
                --taken-h: 125px;
                --taken-margin: -50px;
            }

            /* Schermi medi (es. quando è compresso nel banner del sito) */
            @media (max-width: 900px), (max-height: 750px) {
                :root {
                    --card-w: 85px;
                    --card-h: 130px;
                    --gap-cards: 10px;
                    --briscola-left: 45px;
                    --deck-left: 5%;
                    --center-h: 160px;
                    --score-pad: 15px;
                    --score-font: 18px;
                    --taken-w: 65px;
                    --taken-h: 100px;
                    --taken-margin: -35px;
                }
            }

            /* Schermi molto piccoli (Smartphone) */
            @media (max-width: 600px) {
                :root {
                    --card-w: 60px;
                    --card-h: 90px;
                    --gap-cards: 5px;
                    --briscola-left: 35px;
                    --deck-left: 2%;
                    --center-h: 120px;
                    --score-pad: 10px;
                    --score-font: 14px;
                    --taken-w: 50px;
                    --taken-h: 75px;
                    --taken-margin: -25px;
                }
                .scoreboard {
                    top: 15%;
                    transform: none;
                    right: 10px;
                }
                .top-bar {
                    font-size: 16px;
                    padding: 10px;
                }
            }

            body {
                margin: 0;
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: radial-gradient(circle, #2b7a2b 0%, #153e15 100%);
                color: white;
                height: 100vh;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                user-select: none;
            }

            .top-bar {
                display: flex;
                justify-content: space-between;
                padding: 20px;
                font-size: 24px;
                font-weight: bold;
                background: rgba(0, 0, 0, 0.3);
                z-index: 10;
            }
            .lang-toggle {
                cursor: pointer;
                font-size: 28px;
                transition: transform 0.2s;
            }
            .lang-toggle:hover {
                transform: scale(1.2);
            }
            .table {
                flex-grow: 1;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                align-items: center;
                padding: 20px 0;
                position: relative;
            }

            /* Aree di gioco collegate alle variabili */
            .ai-hand,
            .player-hand {
                display: flex;
                gap: var(--gap-cards);
                height: var(--card-h);
                z-index: 5;
                transition: all 0.3s;
            }
            .center-area {
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                height: var(--center-h);
                width: 100%;
                transition: all 0.3s;
            }

            /* Mazzo e Briscola */
            .deck-area {
                position: absolute;
                left: var(--deck-left);
                width: calc(var(--card-w) + 40px);
                height: var(--card-h);
                transition: all 0.3s;
            }
            .briscola-img {
                position: absolute;
                left: var(--briscola-left);
                top: 15px;
                transform: rotate(90deg);
                width: var(--card-w);
                border-radius: 8px;
                box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
                transition: all 0.3s;
            }
            .deck-img {
                position: absolute;
                left: 0;
                top: 0;
                width: var(--card-w);
                border-radius: 8px;
                box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.6);
                transition: all 0.3s;
            }
            .deck-count {
                position: absolute;
                top: -30px;
                left: 10px;
                font-weight: bold;
                font-size: 18px;
            }

            /* Scontro centrale */
            .clash-area {
                position: absolute;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 30px;
            }

            /* Tabellone Punteggi */
            /* Tabellone Punteggi */
            .scoreboard {
                position: absolute;
                right: 40px;
                top: 50%;
                transform: translateY(-50%);
                background: rgba(0, 0, 0, 0.6);
                padding: var(--score-pad);
                border-radius: 12px;
                font-size: var(--score-font);
                line-height: 1.8;
                box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
                border: 1px solid rgba(255, 255, 255, 0.2);
                text-align: left;
                width: max-content;
                white-space: nowrap;
                transition: all 0.3s;
            }
            .suit-highlight {
                color: #d4af37;
                font-weight: bold;
                text-transform: uppercase;
            }

            /* Carte */
            .card {
                width: var(--card-w);
                height: var(--card-h);
                border-radius: 8px;
                background-size: contain;
                background-position: center;
                background-repeat: no-repeat;
                background-color: white;
                box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
                transition: all 0.3s;
            }
            .player-card {
                cursor: pointer;
            }
            .player-card:hover {
                transform: translateY(-15px);
                box-shadow: 2px 10px 20px rgba(0, 0, 0, 0.5);
            }

            /* Overlay e Bottoni Menu */
            .overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.9);
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: column;
                z-index: 100;
            }
            .menu-btn {
                padding: 15px 30px;
                margin: 10px;
                font-size: 18px;
                cursor: pointer;
                border-radius: 8px;
                border: none;
                font-weight: bold;
                width: 300px;
                max-width: 90vw;
                transition: 0.2s;
            }
            .btn-drqn {
                background: #c23b3b;
                color: white;
            }
            .btn-drqn:hover {
                background: #e04a4a;
            }
            .btn-ppo {
                background: #3b5dc2;
                color: white;
            }
            .btn-ppo:hover {
                background: #4a74e0;
            }
            .btn-ens {
                background: #963bc2;
                color: white;
            }
            .btn-ens:hover {
                background: #b64ae0;
            }
            .btn-play {
                background: #d4af37;
                color: black;
                margin-top: 30px;
            }
            .btn-play:hover {
                background: #e5c158;
            }

            /* Fine partita: Carte in linea */
            .end-screen {
                justify-content: space-evenly;
                padding: 20px 0;
            }
            .taken-row {
                display: flex;
                flex-direction: column;
                align-items: center;
                width: 100%;
            }
            .taken-cards-container {
                display: flex;
                justify-content: center;
                width: 100%;
                max-width: 900px;
                padding: 20px;
            }
            .taken-card {
                width: var(--taken-w);
                height: var(--taken-h);
                border-radius: 6px;
                box-shadow: -4px 0 10px rgba(0, 0, 0, 0.6);
                margin-left: var(--taken-margin);
                transition: transform 0.2s;
                position: relative;
            }
            .taken-card:first-child {
                margin-left: 0;
            }
            .taken-card:hover {
                transform: translateY(-15px);
                z-index: 50;
            }
            .end-title {
                font-size: 35px;
                margin: 10px;
                text-shadow: 2px 2px 10px black;
                text-align: center;
            }
            .end-subtitle {
                font-size: 20px;
                color: #ccc;
                margin-bottom: 10px;
            }
        </style>
    </head>
    <body>
        <div class="top-bar">
            <div id="status-msg"></div>
            <div class="lang-toggle" onclick="toggleLanguage()" id="flag-icon">
                🇮🇹
            </div>
        </div>

        <div class="table">
            <div class="ai-hand" id="ai-hand"></div>
            <div class="center-area">
                <div class="deck-area" id="deck-area">
                    <div class="deck-count" id="deck-count">Mazzo: 34</div>
                    <img
                        id="briscola-card"
                        class="briscola-img"
                        src=""
                        alt="Briscola"
                    />
                    <img
                        class="deck-img"
                        id="deck-back"
                        src="immagini/dorso.png"
                        alt="Mazzo"
                    />
                </div>
                <div class="clash-area" id="clash-area"></div>
            </div>
            <div class="player-hand" id="player-hand"></div>

            <div class="scoreboard" id="scoreboard">
                <div id="score-player">Player: 0</div>
                <div id="score-ai">AI: 0</div>
                <br />
                <div id="score-briscola">
                    Briscola:<br /><span class="suit-highlight">"-"</span>
                </div>
            </div>
        </div>

        <div class="overlay" id="menu-overlay">
            <h1
                id="menu-title"
                style="
                    font-size: 40px;
                    margin-bottom: 40px;
                    text-shadow: 2px 2px 10px black;
                    text-align: center;
                "
            >
                Choose your opponent
            </h1>
            <button class="menu-btn btn-drqn" onclick="startGame('DRQN')">
                DRQN (Strategist)
            </button>
            <button class="menu-btn btn-ppo" onclick="startGame('PPO')">
                PPO (Calculator)
            </button>
            <button class="menu-btn btn-ens" onclick="startGame('ENSEMBLE')">
                ENSEMBLE (Hybrid Monster)
            </button>
        </div>

        <div class="overlay end-screen" id="end-overlay" style="display: none">
            <div class="taken-row">
                <div class="end-subtitle" id="end-ai-title">AI's Booty</div>
                <div class="taken-cards-container" id="end-ai-cards"></div>
            </div>
            <div style="text-align: center">
                <h1 class="end-title" id="end-message"></h1>
                <button
                    class="menu-btn btn-play"
                    id="btn-play-again"
                    onclick="showMenu()"
                >
                    Play Again
                </button>
            </div>
            <div class="taken-row">
                <div class="end-subtitle" id="end-player-title">Your Booty</div>
                <div class="taken-cards-container" id="end-player-cards"></div>
            </div>
        </div>

        <script>
            // INSERISCI QUI IL TUO URL DI HUGGING FACE
            const API_BASE_URL = "https://thelcoco-briscola-backend.hf.space";

            let currentLang = "en";
            window.lastState = null;

            const i18n = {
                en: {
                    flag: "🇮🇹",
                    title: "Choose your opponent",
                    turn_you: "It's your turn!",
                    turn_ai: "AI played. Your turn!",
                    win: "YOU WON! 🎉",
                    draw: "DRAW! 🤝",
                    lose: "AI WINS! 💀",
                    deck: "Deck",
                    player: "Player",
                    ai: "AI",
                    briscola: "Briscola",
                    suits: ["CLUBS", "CUPS", "COINS", "SWORDS"],
                    ai_move: "AI Move",
                    your_move: "Your Move",
                    ai_resp: "AI Response",
                    your_resp: "Your Response",
                    play_again: "Play Again",
                    drqn: "DRQN",
                    ppo: "PPO",
                    ens: "ENSEMBLE",
                    booty_ai: "AI's taken cards",
                    booty_you: "Your taken cards",
                },
                it: {
                    flag: "🇬🇧",
                    title: "Scegli il tuo avversario",
                    turn_you: "Tocca a te!",
                    turn_ai: "L'IA ha giocato. Tocca a te!",
                    win: "HAI VINTO! 🎉",
                    draw: "PAREGGIO! 🤝",
                    lose: "L'IA HA VINTO! 💀",
                    deck: "Mazzo",
                    player: "Tu",
                    ai: "IA",
                    briscola: "Briscola",
                    suits: ["BASTONI", "COPPE", "DENARI", "SPADE"],
                    ai_move: "Colpo IA",
                    your_move: "Tuo colpo",
                    ai_resp: "Risposta IA",
                    your_resp: "Sua risposta",
                    play_again: "Gioca di nuovo",
                    drqn: "DRQN (Stratega)",
                    ppo: "PPO (Calcolatore)",
                    ens: "ENSEMBLE (Mostro Ibrido)",
                    booty_ai: "Carte prese dall'IA",
                    booty_you: "Carte prese da te",
                },
            };

            let isProcessing = false;

            function toggleLanguage() {
                currentLang = currentLang === "en" ? "it" : "en";
                applyLanguage();
            }

            function applyLanguage() {
                const t = i18n[currentLang];
                document.getElementById("flag-icon").innerText = t.flag;
                document.getElementById("menu-title").innerText = t.title;
                document.querySelector(".btn-drqn").innerText = t.drqn;
                document.querySelector(".btn-ppo").innerText = t.ppo;
                document.querySelector(".btn-ens").innerText = t.ens;
                document.getElementById("btn-play-again").innerText =
                    t.play_again;
                document.getElementById("end-ai-title").innerText = t.booty_ai;
                document.getElementById("end-player-title").innerText =
                    t.booty_you;

                if (window.lastState) renderState(window.lastState);
                else document.getElementById("status-msg").innerText = t.title;
            }

            function showMenu() {
                document.getElementById("end-overlay").style.display = "none";
                document.getElementById("menu-overlay").style.display = "flex";
                window.lastState = null;
                applyLanguage();
            }

            async function startGame(model) {
                document.getElementById("menu-overlay").style.display = "none";
                const response = await fetch(
                    `${API_BASE_URL}/api/start/${model}`,
                );
                const state = await response.json();
                renderState(state);
                document.getElementById("status-msg").innerText =
                    i18n[currentLang].turn_you;
            }

            async function playCard(index) {
                if (isProcessing) return;
                isProcessing = true;

                const clickedCard = document.getElementById(
                    `card-slot-${index}`,
                );
                if (clickedCard) clickedCard.style.visibility = "hidden";

                const response = await fetch(
                    `${API_BASE_URL}/api/play/${index}`,
                );
                const state = await response.json();

                const turno = state.ultimo_turno;
                const t = i18n[currentLang];

                const clashHtml = `
                <div style="text-align: center;">
                    <div style="margin-bottom: 5px; font-weight:bold;">${turno.primo_a_giocare === "Umano" ? t.your_move : t.your_resp}</div>
                    <div class="card" style="background-image: url('immagini/${turno.carta_umano}.png')"></div>
                </div>
                <div style="text-align: center;">
                    <div style="margin-bottom: 5px; font-weight:bold;">${turno.primo_a_giocare === "IA" ? t.ai_move : t.ai_resp}</div>
                    <div class="card" style="background-image: url('immagini/${turno.carta_ia}.png')"></div>
                </div>
                `;
                document.getElementById("clash-area").innerHTML = clashHtml;
                document.getElementById("status-msg").innerText =
                    `${turno.vincitore === "Umano" ? t.player : t.ai} wins!`;

                setTimeout(() => {
                    document.getElementById("clash-area").innerHTML = "";
                    renderState(state);

                    if (state.game_over) {
                        showEndScreen(state, t);
                    } else {
                        document.getElementById("status-msg").innerText =
                            state.carta_in_terra !== null
                                ? t.turn_ai
                                : t.turn_you;
                        isProcessing = false;
                    }
                }, 2000);
            }

            function renderState(state) {
                window.lastState = state;
                const t = i18n[currentLang];

                document.getElementById("score-player").innerText =
                    `${t.player}: ${state.punti_umano}`;
                document.getElementById("score-ai").innerText =
                    `${t.ai}: ${state.punti_ia}`;

                if (state.briscola !== null) {
                    const suitIndex = Math.floor(state.briscola / 10);
                    document.getElementById("score-briscola").innerHTML =
                        `${t.briscola}:<br><span class="suit-highlight">"${t.suits[suitIndex]}"</span>`;
                } else {
                    document.getElementById("score-briscola").innerHTML =
                        `${t.briscola}:<br><span class="suit-highlight">"-"</span>`;
                }

                document.getElementById("deck-count").innerText =
                    `${t.deck}: ${state.carte_mazzo}`;
                if (state.carte_mazzo > 0) {
                    document.getElementById("briscola-card").src =
                        `immagini/${state.briscola}.png`;
                    document.getElementById("briscola-card").style.display =
                        "block";
                    document.getElementById("deck-back").style.display =
                        state.carte_mazzo > 1 ? "block" : "none";
                } else {
                    document.getElementById("briscola-card").style.display =
                        "none";
                    document.getElementById("deck-back").style.display = "none";
                }

                let aiHtml = "";
                for (let i = 0; i < state.carte_ia_rimanenti; i++) {
                    aiHtml += `<div class="card" style="background-image: url('immagini/dorso.png')"></div>`;
                }
                document.getElementById("ai-hand").innerHTML = aiHtml;

                if (state.carta_in_terra !== null) {
                    document.getElementById("clash-area").innerHTML = `
                    <div style="text-align: center;">
                        <div style="margin-bottom: 5px; font-weight:bold;">${t.ai_move}</div>
                        <div class="card" style="background-image: url('immagini/${state.carta_in_terra}.png')"></div>
                    </div>`;
                } else {
                    document.getElementById("clash-area").innerHTML = "";
                }

                let playerHtml = "";
                state.mano_umano.forEach((cartaId, index) => {
                    playerHtml += `<div id="card-slot-${index}" class="card player-card" style="background-image: url('immagini/${cartaId}.png')" onclick="playCard(${index})"></div>`;
                });
                document.getElementById("player-hand").innerHTML = playerHtml;
            }

            function showEndScreen(state, t) {
                document.getElementById("end-overlay").style.display = "flex";
                let msg =
                    state.punti_umano > 60
                        ? t.win
                        : state.punti_umano == 60
                          ? t.draw
                          : t.lose;
                document.getElementById("end-message").innerText =
                    `${msg} (${state.punti_umano} - ${state.punti_ia})`;

                let aiCardsHtml = "";
                state.prese_ia.forEach((c) => {
                    aiCardsHtml += `<div class="card taken-card" style="background-image: url('immagini/${c}.png')"></div>`;
                });
                document.getElementById("end-ai-cards").innerHTML = aiCardsHtml;

                let playerCardsHtml = "";
                state.prese_umano.forEach((c) => {
                    playerCardsHtml += `<div class="card taken-card" style="background-image: url('immagini/${c}.png')"></div>`;
                });
                document.getElementById("end-player-cards").innerHTML =
                    playerCardsHtml;
            }

            window.onload = showMenu;
        </script>
    </body>
</html>
